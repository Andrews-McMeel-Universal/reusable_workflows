name: Update Azure API Management

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Deploy environment. Can be development, staging, or production."
      apiSpecificationPath:
        required: false
        type: string
        description: "Relative Path to Open API Specification."
        default: ${{ vars.API_SCHEMA_PATH || '/swagger/vx/swagger.json' }}
      repositoryName:
        required: false
        type: string
        description: "GitHub Repository Name."
        default: ${{ github.event.repository.name }}
      productId:
        required: false
        type: string
        description: "API Management Product ID."
        default: ${{ vars.API_PRODUCT_ID || 'AZ-WebServices' }}
      apiSuffix:
        required: false
        type: string
        description: "API Suffix for the API URL."
        default: ${{ vars.API_SUFFIX || 'true' }}
      deploymentWebhook:
        required: false
        type: string
        description: "The webhook URL for the deployment status"
        default: ${{ vars.MSTEAMS_DEPLOYMENT_WEBHOOK }}
      apiVersionHeaders:
        required: false
        type: string
        description: "Use version headers instead of version paths"
        default: ${{ vars.API_VERSION_HEADERS || 'false' }}
      githubRunner:
        required: false
        type: string
        description: "The type of runner to use"
        default: ${{ vars.CUSTOM_GITHUB_RUNNER || 'azure' }}
    secrets:
      azurePassword:
        required: false
      azureSubscription:
        required: false
      azureCredentials:
        required: false
      storageAccountKey:
        required: true

jobs:
  update-api-management:
    name: Update API Management Service
    runs-on: ${{ inputs.githubRunner }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          $installModules = @(
            "AzTable"
          )
          Install-Module -Name $installModules -Force

      - name: Login via Az module
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          creds: "${{ secrets.azureCredentials }}"
          enable-AzPSSession: true

      - name: Retrieve Application information
        id: getappinfo
        shell: pwsh
        run: |
          # Define the storage account and table name
          $appInfoTableName = "DeployedApplications"
          $storageAccountName = "amucloudapps"

          $storageContext = New-AzStorageContext -StorageAccountName $storageAccountName -StorageAccountKey ${{ secrets.storageAccountKey }}

          # Get Storage table
          try {
              $appInfoTable = (Get-AzStorageTable -Name $appInfoTableName -Context $storageContext -ErrorAction Stop).CloudTable 
              }
          catch {
              Write-Error -Message "Error accessing cloud $appInfoTableName table.  Error message was: $_.Exception.Message"
              return
              }

          # Retrieve the application information
          $appInfo = Get-AzTableRow -Table $appInfoTable -PartitionKey "${{ inputs.repositoryName }}" -RowKey "${{ inputs.environment }}"

          # Set the application information as output variables
          echo "applicationIngressFqdn=$($appInfo.IngressFqdn)" >> $env:GITHUB_OUTPUT
          echo "applicationName=$($appInfo.ApplicationName)" >> $env:GITHUB_OUTPUT

      - name: Update Azure API Management
        shell: pwsh
        env:
          apiVersionHeaders: ${{ inputs.apiVersionHeaders }}
          ApiProductId: ${{ inputs.productId }}
          apiSuffix: ${{ inputs.apiSuffix }}
          repositoryName: ${{ github.event.repository.name }}
          environment: ${{ inputs.environment }}
          serviceFqdn: ${{ steps.getappinfo.outputs.applicationIngressFqdn }}
          apiSpecificationPath: ${{ inputs.apiSpecificationPath }}
          customGitHubRunner: ${{ inputs.githubRunner }}
          defaultAPIPolicy: https://amucloudapps.blob.core.windows.net/apim/default-azure-apim-policy-schema.xml
          applicationName: ${{ steps.getappinfo.outputs.applicationName }}
        run: |
          #requires -Modules Az.Accounts, Az.Resources, Az.ApiManagement

          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $ApiVersions = 1..3

          # Generate API ID by appending "-api" to the repository name and replacing invalid characters
          $ApiSuffix = if ($env:apiSuffix -eq "true") { "-api" } else { "" }
          $ApiId = ("${env:repositoryName}${ApiSuffix}").Replace("/", "-").Replace("\", "-").Replace("_", "-")
          $ApiId = $ApiId -replace '[*#&+:<>?]', "-"

          $ApimResources = @(Get-AzResource -ResourceType "Microsoft.ApiManagement/service" -Tag @{ environment = $env:environment })
          if ($ApimResources.Count -ne 1) {
              throw "Expected exactly one API Management service with environment tag '$env:environment', found $($ApimResources.Count)."
          }
          $ResourceGroup = $ApimResources[0].ResourceGroupName
          $ServiceName = $ApimResources[0].Name

          $ServiceURL = ("https://{0}" -f $env:serviceFqdn).TrimEnd("/")
          $APISchemaPathTemplate = $env:apiSpecificationPath
          $APISchemaPathFile = Split-Path -Path $APISchemaPathTemplate -Leaf
          $VersionDiscoveryEnabled = $APISchemaPathTemplate -match "vx"

          # Create a context object for API management operations
          $Context = New-AzApiManagementContext -ResourceGroupName $ResourceGroup -ServiceName $ServiceName

          function Get-APISpecWithRetry {
              param(
                  [Parameter(Mandatory)]
                  [string]$APISchemaUrl,
                  [int]$MaxAttempts = 3,
                  [int]$DelaySeconds = 10
              )

              for ($Attempt = 1; $Attempt -le $MaxAttempts; $Attempt++) {
                  try {
                      $Response = Invoke-WebRequest -Uri $APISchemaUrl -ErrorAction Stop
                      if ([string]::IsNullOrWhiteSpace($Response.Content)) {
                          throw "Endpoint returned an empty response."
                      }
                      $null = $Response.Content | ConvertFrom-Json -ErrorAction Stop
                      Write-Host "Successfully retrieved API spec from $APISchemaUrl on attempt $Attempt."
                      return [string]$Response.Content
                  }
                  catch {
                      Write-Warning "Attempt $Attempt/$MaxAttempts failed for $APISchemaUrl : $($_.Exception.Message)"
                      if ($Attempt -lt $MaxAttempts) {
                          Start-Sleep -Seconds $DelaySeconds
                      }
                  }
              }
              return $null
          }

          function Import-API {
              param(
                  [Parameter(Mandatory)]
                  [string]$SpecificationPath,
                  [Parameter(Mandatory)]
                  [string]$ApiId,
                  [Parameter(Mandatory)]
                  [string]$ApiPath,
                  [string]$ApiVersion,
                  [Parameter(Mandatory)]
                  [object]$Context,
                  [string]$ApiVersionSetId,
                  [int]$MaxAttempts = 5
              )

              $ApiImportParams = @{
                  Context             = $Context
                  SpecificationPath   = $SpecificationPath
                  SpecificationFormat = "OpenApi"
                  Path                = $ApiPath
                  ApiId               = $ApiId
              }

              if (-not [string]::IsNullOrWhiteSpace($ApiVersionSetId)) {
                  $ApiImportParams.ApiVersionSetId = $ApiVersionSetId
                  $ApiImportParams.ApiVersion = $ApiVersion
              }

              for ($Attempt = 1; $Attempt -le $MaxAttempts; $Attempt++) {
                  try {
                      Import-AzApiManagementApi @ApiImportParams -ErrorAction Stop | Out-Null
                      Write-Host "Successfully imported $ApiId."
                      return
                  }
                  catch {
                      if ($Attempt -ge $MaxAttempts) {
                          throw "API import failed after $MaxAttempts attempts: $($_.Exception.Message)"
                      }
                      Write-Warning "API import attempt $Attempt/$MaxAttempts failed: $($_.Exception.Message)"
                      Write-Host "Waiting 15 seconds before retrying..."
                      Start-Sleep -Seconds 15
                  }
              }
          }

          function Update-API {
              param(
                  [Parameter(Mandatory)]
                  [string]$ApiId,
                  [int]$Version,
                  [Parameter(Mandatory)]
                  [string]$ServiceURL,
                  [Parameter(Mandatory)]
                  [object]$Context
              )

              $BackendURL = $ServiceURL
              if ($Version) {
                  $BackendURL += "/v$Version"
              }

              Write-Host "Setting backend for $ApiId to $BackendURL"
              Set-AzApiManagementApi -Context $Context -ApiId $ApiId -ServiceUrl $BackendURL -SubscriptionRequired -ErrorAction Stop | Out-Null

              $ProductIds = @("AZ-WebServices")
              if (-not [string]::IsNullOrWhiteSpace($env:ApiProductId) -and $env:ApiProductId -ne "AZ-WebServices") {
                  $ProductIds += $env:ApiProductId
              }
              foreach ($ProductId in ($ProductIds | Select-Object -Unique)) {
                  Add-AzApiManagementApiToProduct -Context $Context -ApiId $ApiId -ProductId $ProductId -ErrorAction Stop | Out-Null
              }
          }

          $DiscoveredAPIs = @()
          if ($VersionDiscoveryEnabled) {
              foreach ($Version in $ApiVersions) {
                  $SchemaPath = $APISchemaPathTemplate.Replace("vx", "v$Version")
                  if (-not $SchemaPath.StartsWith("/")) {
                      $SchemaPath = "/$SchemaPath"
                  }
                  if ($env:customGitHubRunner -eq "boley") {
                      $APISchemaUrl = "http://$($env:applicationName).${env:environment}.svc.cluster.local$SchemaPath"
                  }
                  else {
                      $APISchemaUrl = "https://$($env:serviceFqdn)$SchemaPath"
                  }
                  Write-Host "Checking API version v$Version at $APISchemaUrl"
                  $Contents = Get-APISpecWithRetry -APISchemaUrl $APISchemaUrl
                  if ($null -eq $Contents) {
                      Write-Warning "API version v$Version was not reachable. Skipping."
                      continue
                  }
                  $DiscoveredAPIs += [pscustomobject]@{
                      Version  = $Version
                      Url      = $APISchemaUrl
                      Contents = $Contents
                  }
              }
          }
          else {
              $SchemaPath = $APISchemaPathTemplate
              if (-not $SchemaPath.StartsWith("/")) {
                  $SchemaPath = "/$SchemaPath"
              }
              $APISchemaUrl = "https://$($env:serviceFqdn)$SchemaPath"
              Write-Host "Checking API at $APISchemaUrl"
              $Contents = Get-APISpecWithRetry -APISchemaUrl $APISchemaUrl

              if ($null -ne $Contents) {
                  $DiscoveredAPIs += [pscustomobject]@{
                      Version  = $null
                      Url      = $APISchemaUrl
                      Contents = $Contents
                  }
              }
          }

          if ($DiscoveredAPIs.Count -eq 0) {
              throw "No API specifications were reachable. Nothing was imported."
          }
          if ($VersionDiscoveryEnabled) {
              Write-Host "Discovered $($DiscoveredAPIs.Count) API version(s): $($DiscoveredAPIs.Version -join ', ')"
          }
          else {
              Write-Host "Discovered non-versioned API."
          }
          $UseVersionSet = $DiscoveredAPIs.Count -gt 1
          $ApiVersionSetId = $null
          if ($UseVersionSet) {
              $MatchingVersionSets = @(Get-AzApiManagementApiVersionSet -Context $Context | Where-Object { $_.DisplayName -eq $ApiId })
              if ($MatchingVersionSets.Count -gt 1) {
                  throw "Multiple API version sets have display name '$ApiId'."
              }
              if ($MatchingVersionSets.Count -eq 1) {
                  $ApiVersionSet = $MatchingVersionSets[0]
              }
              else {
                  Write-Host "Creating API version set '$ApiId'."
                  $ApiVersionSet = New-AzApiManagementApiVersionSet -Context $Context -ApiVersionSetId $ApiId -Name $ApiId -Scheme Segment -Description "$ApiId API"
              }
              $ApiVersionSetId = $ApiVersionSet.ApiVersionSetId
          }
          $OriginalApi = Get-AzApiManagementApi -Context $Context -ApiId $ApiId -ErrorAction SilentlyContinue

          foreach ($DiscoveredApi in $DiscoveredAPIs) {
              $Version = $DiscoveredApi.Version

              if ($UseVersionSet) {
                  $VersionedApiId = "$ApiId-v$Version"
                  $APISchemaContents = $DiscoveredApi.Contents -replace "/v${Version}", ""
                  $ApiVersionName = "v$Version"
              }
              else {
                  $VersionedApiId = $ApiId
                  $APISchemaContents = $DiscoveredApi.Contents
                  $ApiVersionName = $null
              }

              $APISchemaContents | Out-File -FilePath $APISchemaPathFile -Encoding utf8

              Write-Host "Importing API from $($DiscoveredApi.Url)"
              Import-API -ApiId $VersionedApiId -ApiPath $ApiId -ApiVersion $ApiVersionName -SpecificationPath $APISchemaPathFile -Context $Context -ApiVersionSetId $ApiVersionSetId
              Update-API -ApiId $VersionedApiId -Version $Version -ServiceURL $ServiceURL -Context $Context
          }

          if ($UseVersionSet -and $null -ne $OriginalApi) {
              Write-Host "Removing legacy API '$ApiId' now that versioned APIs exist."
              Remove-AzApiManagementApi -Context $Context -ApiId $ApiId -Confirm:$false -ErrorAction Stop
          }

          Write-Host "API Management import completed successfully."

      - name: Send Failed Deployment report to Teams
        if: failure() && (inputs.environment != 'development')
        uses: jdcargile/ms-teams-notification@28e5ca976c053d54e2b852f3f38da312f35a24fc
        with:
          github-token: ${{ github.token }}
          ms-teams-webhook-uri: ${{ inputs.deploymentWebhook }}
          notification-summary: "${{ github.event.release.tag_name != '' && format('[{0}] ', github.event.release.tag_name) || ' ' }}Failed updating API in ${{ inputs.environment }}"
          notification-color: 17a2b8
          timezone: America/Chicago
          verbose-logging: true

      - name: Send Succeeded Deployment report to Teams
        if: success() && (inputs.environment != 'development')
        uses: jdcargile/ms-teams-notification@28e5ca976c053d54e2b852f3f38da312f35a24fc
        with:
          github-token: ${{ github.token }}
          ms-teams-webhook-uri: ${{ inputs.deploymentWebhook }}
          notification-summary: "${{ github.event.release.tag_name != '' && format('[{0}] ', github.event.release.tag_name) || ' ' }}Successfully updated API in ${{ inputs.environment }}"
          notification-color: 28a745
          timezone: America/Chicago
          verbose-logging: true