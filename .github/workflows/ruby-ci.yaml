name: Ruby on Rails Application CI

on:
  workflow_call:
    inputs:
      environment:
        required: false
        type: string
        description: "The environment to use for the CI"
        default: ${{ vars.APPLICATION_CI_ENVIRONMENT || 'development' }}
      APT_PACKAGES:
        required: false
        type: string
        default: ${{ vars.APPLICATION_CI_APT_PACKAGES || 'curl' }}
        description: "Apt packages to install"
      INSTALL_NODE:
        required: false
        type: string
        description: "Whether to install Node.js or not"
        default: 'false'
      NODE_VERSION:
        required: false
        type: string
        description: "Node.js version to install"
        default: "14"
      GITHUB_RUNNER:
        required: false
        type: string
        description: "The type of runner to use"
        default: ${{ vars.CUSTOM_GITHUB_RUNNER || 'ubuntu-latest' }}
      HEALTHCHECK_URL:
        required: false
        type: string
        description: "URL to use for healthcheck"
        default: ${{ vars.HEALTHCHECK_URL || 'http://localhost:3000/health' }}
      GIT_CHECKOUT_SUBMODULES:
        required: false
        type: string
        description: "Check out submodules"
        default: ${{ vars.GIT_CHECKOUT_SUBMODULES }}
      WEBPACK_ASSET_PRECOMPILATION:
        required: false
        type: string
        description: "Run webpack asset precompilation step"
        default: ${{ vars.APPLICATION_CI_WEBPACK_PRECOMPILATION || 'false' }}
      YARN_INSTALL:
        required: false
        type: string
        default: ${{ vars.APPLICATION_CI_YARN_INSTALL || 'false' }}
      RSPEC_TESTS:
        required: false
        type: string
        description: "Run RSpec tests"
        default: ${{ vars.APPLICATION_CI_RSPEC_TESTS || 'false' }}
      SETUP_MYSQL_DATABASE:
        required: false
        type: string
        description: "Toggle setting up the MySQL database"
        default: ${{ vars.APPLICATION_CI_SETUP_MYSQL_DATABASE || 'false' }}
      MYSQL_VERSION:
        required: false
        type: string
        description: "MySQL version to use"
        default: ${{ vars.APPLICATION_CI_MYSQL_VERSION || 'latest' }}
    secrets:
      AZURE_CREDENTIALS:
        required: true
      PAT_ACTION_CI:
        required: false

env:
  RAILS_ENV: ${{ inputs.environment }}

jobs:
  vars:
    name: Retrieve Environment Variables
    runs-on: ${{ inputs.GITHUB_RUNNER }}
    steps:
      - name: Use .env cache action
        id: get-envs
        uses: Andrews-McMeel-Universal/get-envs@v1
        with:
          azurecredentials: ${{ secrets.AZURE_CREDENTIALS }}
          environment: ${{ inputs.environment }}
    outputs:
      DATABASE_ROOT_PASSWORD: ${{ steps.get-envs.outputs.DATABASE_ROOT_PASSWORD }}
      DATABASE_USERNAME: ${{ steps.get-envs.outputs.DATABASE_USERNAME }}
      DATABASE_PASSWORD: ${{ steps.get-envs.outputs.DATABASE_PASSWORD }}
      DATABASE_NAME: ${{ steps.get-envs.outputs.DATABASE_NAME }}
      KEYVAULT_NAME: ${{ steps.get-envs.outputs.keyVaultName }}
  ci:
    name: Build and Test
    needs: [vars]
    runs-on: ${{ inputs.GITHUB_RUNNER }}
    services:
      mysql:
        image: mysql:${{ inputs.MYSQL_VERSION }}
        env:
          MYSQL_DATABASE: ${{ needs.vars.outputs.DATABASE_NAME }}
          MYSQL_ROOT_PASSWORD: ${{ needs.vars.outputs.DATABASE_ROOT_PASSWORD }}
          MYSQL_USER: ${{ needs.vars.outputs.DATABASE_USERNAME }}
          MYSQL_PASSWORD: ${{ needs.vars.outputs.DATABASE_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: ${{ inputs.GIT_CHECKOUT_SUBMODULES }}
          token: ${{ secrets.PAT_ACTION_CI || github.token }}

      - name: Use .env cache action
        uses: Andrews-McMeel-Universal/get-envs@v1
        with:
          azurecredentials: ${{ secrets.AZURE_CREDENTIALS }}
          environment: ${{ inputs.environment }}
          environmentKeyVault: ${{ needs.vars.outputs.KEYVAULT_NAME }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: ${{ inputs.INSTALL_NODE == 'true' }}
        with:
          node-version: ${{ inputs.NODE_VERSION }}

      - name: Install apt packages
        run: sudo apt-get update -y && sudo apt-get install -y ${{ inputs.APT_PACKAGES }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          bundler-cache: true

      - name: Run Yarn Install
        if: ${{ inputs.YARN_INSTALL != 'false' }}
        uses: Andrews-McMeel-Universal/cache-yarn-install@v1
        with:
          enable-corepack: false

      - name: Run Webpack Asset Precompilation
        if: ${{ inputs.WEBPACK_ASSET_PRECOMPILATION != 'false' }}
        run: bundle exec rake assets:precompile
      
      - name: Run Rails database migrations
        if: ${{ inputs.SETUP_MYSQL_DATABASE == 'true' }}
        run: bundle exec rails db:migrate && bundle exec rails db:seed

      - name: Boot Rails server
        env:
          RSPEC_TESTS: ${{ inputs.RSPEC_TESTS }}
        run: |
          bundle exec rails s -b 0.0.0.0 -p 3000 &
          PID=$!
          sleep 10
          HEALTHCHECK_URL="${{ inputs.HEALTHCHECK_URL }}"
          if [[ "${HEALTHCHECK_URL}" == *","* ]]; then
            IFS=',' read -ra URLS <<< "${HEALTHCHECK_URL}"
          else
            URLS=("${HEALTHCHECK_URL}")
          fi
          if [[ "${RSPEC_TESTS}" == "true" ]]; then
            bundle exec rspec
          fi
          for URL in "${URLS[@]}"; do
            echo "Checking healthcheck URL: ${URL}"
            for i in {1..5}; do
              STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${URL}")
              if [[ "$STATUS_CODE" -eq 200 ]]; then
                echo "✅ [PASSED] Healthcheck passed for ${URL}" | tee -a $GITHUB_STEP_SUMMARY
                break
              else
                echo "❌ [FAILED] Healthcheck not ready yet for ${URL} (status: $STATUS_CODE). Retrying in 2 seconds..." | tee -a $GITHUB_STEP_SUMMARY
                sleep 2
              fi
              if [[ $i -eq 5 ]]; then
                echo "❌ [FAILED] Healthcheck failed for ${URL} after multiple attempts." | tee -a $GITHUB_STEP_SUMMARY
                kill -2 $PID
                exit 1
              fi
            done
          done
          sleep 10
          if [[ $(ps -p $PID) ]] ; then 
            kill -2 $PID
            exit 0
          else
            echo "App failed to start."
            exit 1
          fi
